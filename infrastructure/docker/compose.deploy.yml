# Local deployment scaffold. This file does not attach the development database.
# The development database is infrastructure/docker/compose.yaml on host port 5432,
# volume docker_apex_pg_data. This stack uses volume apex_deploy_pg_data and does
# not publish PostgreSQL or the worker.
#
# This is production-mode configuration for a local validation scaffold. It is not
# an internet-reachable deployment. The API is bound to loopback. Put TLS and a
# reverse proxy in front of it before any other interface is exposed. Authentication
# stays fail-closed: development auth is off, and /ready stays 503 until identity
# is configured outside this file.
#
# APEX_POSTGRES_PASSWORD is required. Compose fails if it is missing. There is no
# default password. One worker is the supported topology. A second worker is not
# fenced after its lease expires.
#
# The image command is the API. The worker service replaces that command.
# Migrations run once in the migrate service. Neither process migrates on startup.

name: apex-deploy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${APEX_POSTGRES_PASSWORD:?APEX_POSTGRES_PASSWORD is required}
      POSTGRES_DB: apex
    volumes:
      - apex_deploy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: apex-ai:deploy
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      APEX_DATABASE_URL: postgresql+psycopg://apex:${APEX_POSTGRES_PASSWORD}@postgres:5432/apex
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: apex-ai:deploy
    environment:
      APEX_ENVIRONMENT: production
      APEX_DEV_AUTH_ENABLED: "false"
      APEX_SEED_DEV_PRINCIPALS: "false"
      APEX_DEFER_GOAL_EXECUTION: "true"
      APEX_DATABASE_URL: postgresql+psycopg://apex:${APEX_POSTGRES_PASSWORD}@postgres:5432/apex
      APEX_MODEL_PROVIDER: mock
      APEX_INSTANCE_ID: api
      APEX_SECRET_PROVIDER: env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s

  worker:
    image: apex-ai:deploy
    command: ["apex-worker"]
    environment:
      APEX_ENVIRONMENT: production
      APEX_DEV_AUTH_ENABLED: "false"
      APEX_SEED_DEV_PRINCIPALS: "false"
      APEX_DEFER_GOAL_EXECUTION: "true"
      APEX_DATABASE_URL: postgresql+psycopg://apex:${APEX_POSTGRES_PASSWORD}@postgres:5432/apex
      APEX_MODEL_PROVIDER: mock
      APEX_INSTANCE_ID: worker
      APEX_WORKER_HEALTH_PORT: "8001"
      APEX_WORKER_INTERVAL_SECONDS: "5"
      APEX_LEASE_SECONDS: "60"
      APEX_WORKER_SHUTDOWN_SECONDS: "20"
      APEX_SECRET_PROVIDER: env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  apex_deploy_pg_data:
    name: apex_deploy_pg_data
