# Local PostgreSQL for Apex development. The password is local-only.
# This file does not start the API or the worker. The supported stack is compose.deploy.yml.
# Do not rename apex_pg_data. The running development project stores it as docker_apex_pg_data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5432:5432"
    volumes:
      - apex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex_pg_data:
