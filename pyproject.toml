[project]
name = "apex-ai"
version = "1.0.0rc1"
description = "Apex AI foundational runtime: coordinated intelligence with controlled authority."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "pyjwt[crypto]>=2.10",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
apex-api = "apex.api.cli:main"
apex-worker = "apex.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/integration/deployment_probe.py" = ["S101", "S105", "S106", "S310", "S603", "S607"]
"tests/integration/backup_restore.py" = ["S101", "S105", "S106", "S603", "S607"]
"tests/security/test_deployment_compose.py" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apex"]

[tool.mypy]
python_version = "3.12"
packages = ["apex"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]
